name: Build and verify management server
on:
  push:
    branches: [main, 'feature/**']
    tags: ['server-v*-preview.*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Acceptance platform (Windows first, then Linux)'
        type: choice
        default: all
        options: [all, windows, linux]
      windows_runner:
        description: 'Windows OS for native server acceptance'
        type: choice
        default: windows-latest
        options: [windows-latest, windows-2022]
      candidate_run_id:
        description: 'Successful server run containing server-win-x64-verification (artifact must not be expired)'
        required: true
        default: '42975268950'
      installer_sha256:
        description: 'Pinned SHA-256 of the accepted installer'
        required: true
        default: '93099bd6fb7cf81c0a410266dda50d63d7018070bcee1285088ec52a7b1ab3dc'
      scope:
        description: 'Full acceptance, Compose only, or Windows maintenance after unchanged integration passed'
        type: choice
        default: full
        options: [full, compose, maintenance, installed, proxmox, reports]
      report_source_run:
        description: 'Reports scope only: existing server.yml run to validate without rerunning checks'
        type: string
      report_source_commit:
        description: 'Reports scope only: exact tested source commit'
        type: string
permissions:
  contents: read
jobs:
  server:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'compose' && inputs.scope != 'installed' && inputs.scope != 'proxmox' && inputs.scope != 'reports')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.platform == 'windows' || inputs.scope == 'maintenance') && '[{"os":"windows-latest","runtime":"win-x64"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' && '[{"os":"ubuntu-latest","runtime":"linux-x64"}]' || '[{"os":"windows-latest","runtime":"win-x64"},{"os":"ubuntu-latest","runtime":"linux-x64"}]') }}
    runs-on: ${{ matrix.runtime == 'win-x64' && (inputs.windows_runner || 'windows-latest') || matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/server/windows_script_syntax.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 syntax check failed.' }
      - run: python -m unittest discover -s tests/server -p "test_*.py"
      - run: dotnet restore tests/SPBackup.Server.Tests --locked-mode
      - run: dotnet build tests/SPBackup.Server.Tests --no-restore -m:1 -nr:false
      - if: runner.os == 'Linux'
        run: |
          python3 tools/dev_server_db.py start --state-dir /tmp/onec-server-ci --name onec-server-ci
          echo "ONECBACKUP_SERVER_TEST_CONNECTION_FILE=/tmp/onec-server-ci/connection-string.txt" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: dotnet test tests/SPBackup.Server.Tests --no-build --no-restore -m:1 -nr:false --filter 'Category!=ServerPackage' --logger 'trx;LogFileName=server-linux.trx' --results-directory artifacts/server-tests
      - if: runner.os == 'Windows' && inputs.scope != 'maintenance'
        run: python tests/server/run_windows.py
      - run: python tools/build_server_distribution.py --runtime ${{ matrix.runtime }}
      - if: runner.os == 'Linux'
        run: |
          export ONECBACKUP_SERVER_TEST_PACKAGE_DIR="$GITHUB_WORKSPACE/artifacts/server/linux-x64"
          dotnet test tests/SPBackup.Server.Tests --no-build --no-restore -m:1 -nr:false --filter 'Category=ServerPackage' --logger 'trx;LogFileName=server-package-linux.trx' --results-directory artifacts/server-tests
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ONECBACKUP_SERVER_TEST_PACKAGE_DIR = Join-Path $PWD 'artifacts/server/win-x64'
          python tests/server/run_windows.py --package
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile artifacts/server/vc_redist.x64.exe
      - if: runner.os == 'Windows'
        run: python tools/build_server_windows_installer.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'SP-Backup-Server-preview8-setup.exe'
          Invoke-WebRequest 'https://github.com/sanekman/1C-Backup/releases/download/server-v0.1.0-preview.8/SP-Backup-Server-0.1.0-preview.8-windows-x64-setup.exe' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '491b9157d5d0664d53ac45ac5f4ba3bc298ab71c0d63cf4d385b126311748309') { throw 'Published baseline checksum differs.' }
          $installer = (Get-ChildItem artifacts/server/SP-Backup-Server-*-windows-x64-setup.exe).FullName
          & (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/server/windows_upgrade_smoke.ps1 -Installer $installer -BaselineInstaller $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows upgrade/recovery acceptance failed.' }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem artifacts/server/SP-Backup-Server-*-windows-x64-setup.exe).FullName
          & tests/server/windows_installer_smoke.ps1 -Installer $installer
      - run: python tests/server/verify_results.py --runtime ${{ matrix.runtime }} ${{ inputs.scope == 'maintenance' && '--maintenance-only' || '' }}
      - if: runner.os == 'Linux'
        run: python3 tests/server/compose_smoke.py
      - if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $setupLog = Join-Path $env:ProgramData 'OneCBackupServer/setup.log'
          if (Test-Path $setupLog) {
            Copy-Item $setupLog artifacts/server-tests/windows-setup.log
            Get-Content $setupLog
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.runtime }}-verification
          path: |
            artifacts/server/SP-Backup-Server-*.exe
            artifacts/server/*.zip
            artifacts/server/*.tar.gz
            artifacts/server/*.sha256
            artifacts/server-tests/*.trx
            artifacts/server-tests/compose-result.json
            artifacts/server-tests/windows-installer-result.json
            artifacts/server-tests/windows-snapshot-result.json
            artifacts/server-tests/windows-upgrade-result.json
            artifacts/server-tests/windows-installer-*.log
            artifacts/server-tests/windows-setup.log
          retention-days: 14
      - if: always() && runner.os == 'Linux'
        run: python3 tools/dev_server_db.py stop --state-dir /tmp/onec-server-ci --name onec-server-ci

  proxmox-installer:
    if: github.event_name != 'workflow_dispatch' || (inputs.platform != 'windows' && inputs.scope != 'compose' && inputs.scope != 'maintenance' && inputs.scope != 'installed' && inputs.scope != 'reports')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/server -p 'test_proxmox*.py'
      - name: Verify native installation with PostgreSQL and HTTPS on Debian 13
        run: python3 tests/server/lxc_installer_smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-proxmox-installer-verification
          path: |
            artifacts/server-tests/proxmox-installer-result.json
            artifacts/server-tests/proxmox-update-result.json
          retention-days: 14

  compose-only:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'compose'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/server/compose_smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-compose-verification
          path: artifacts/server-tests/compose-result.json
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: [server, proxmox-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*-verification
          path: artifacts/server-release
          merge-multiple: true
      - run: python tools/publish_server_release.py --artifacts artifacts/server-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  existing-installer:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'installed'
    permissions:
      contents: read
      actions: read
    runs-on: ${{ inputs.windows_runner || 'windows-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-win-x64-verification
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/candidate
      - name: Verify candidate and native scripts
        shell: pwsh
        env:
          CANDIDATE_INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:CANDIDATE_INSTALLER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid expected installer SHA-256.' }
          $installer = Get-ChildItem artifacts/candidate/server/SP-Backup-Server-*-windows-x64-setup.exe
          if (@($installer).Count -ne 1) { throw 'Expected exactly one candidate installer.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:CANDIDATE_INSTALLER_SHA256.ToLowerInvariant()) { throw 'Candidate checksum differs.' }
          New-Item -ItemType Directory -Path artifacts/server-tests -Force | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          @{source=$env:GITHUB_SHA; candidateRun=$env:CANDIDATE_RUN_ID; installerSha256=$hash; os=$os.Caption; build=$os.BuildNumber} | ConvertTo-Json | Set-Content artifacts/server-tests/windows-target.json
          & (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/server/windows_script_syntax.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native script parsing failed.' }
      - name: Upgrade and recover the published preview.8 installation
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'SP-Backup-Server-preview8-setup.exe'
          Invoke-WebRequest 'https://github.com/sanekman/1C-Backup/releases/download/server-v0.1.0-preview.8/SP-Backup-Server-0.1.0-preview.8-windows-x64-setup.exe' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '491b9157d5d0664d53ac45ac5f4ba3bc298ab71c0d63cf4d385b126311748309') { throw 'Published baseline checksum differs.' }
          $installer = (Get-ChildItem artifacts/candidate/server/SP-Backup-Server-*-windows-x64-setup.exe).FullName
          & (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/server/windows_upgrade_smoke.ps1 -Installer $installer -BaselineInstaller $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Native upgrade/recovery acceptance failed.' }
      - name: Install, maintain and restore the same candidate
        shell: pwsh
        run: |
          $installer = (Get-ChildItem artifacts/candidate/server/SP-Backup-Server-*-windows-x64-setup.exe).FullName
          & tests/server/windows_installer_smoke.ps1 -Installer $installer
          $required = @{'windows-installer-result.json'=21; 'windows-snapshot-result.json'=14; 'windows-upgrade-result.json'=16}
          foreach ($name in $required.Keys) {
            $report = Get-Content (Join-Path 'artifacts/server-tests' $name) -Raw | ConvertFrom-Json -AsHashtable
            if ($report.Count -ne $required[$name] -or @($report.Values | Where-Object { $_ -isnot [bool] -or $_ -ne $true }).Count) { throw ('Native acceptance incomplete: '+$name) }
            Write-Output ($name+': '+$report.Count+' native checks passed.')
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ inputs.windows_runner }}-acceptance
          path: |
            artifacts/server-tests/*.json
            artifacts/server-tests/windows-installer-*.log
          retention-days: 14

  reports:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'reports'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source commit and saved reports without repeating acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.report_source_run }}
          SOURCE_COMMIT: ${{ inputs.report_source_commit }}
          RUNTIME: ${{ inputs.platform == 'windows' && 'win-x64' || 'linux-x64' }}
        run: |
          python3 - <<'PY'
          import json,os,re,shutil,subprocess,sys,tempfile
          from pathlib import Path
          from datetime import datetime,timezone
          run=os.environ['SOURCE_RUN']; commit=os.environ['SOURCE_COMMIT']; runtime=os.environ['RUNTIME']
          if not run.isdecimal() or not re.fullmatch('[a-f0-9]{40}',commit) or runtime not in ['win-x64','linux-x64']:
              raise ValueError('Invalid source identity')
          repo=os.environ['GITHUB_REPOSITORY']
          source=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
          if source['head_sha']!=commit or source['path']!='.github/workflows/server.yml' or source['status']!='completed':
              raise ValueError('Source run does not match expected completed server acceptance')
          platform='windows' if runtime=='win-x64' else 'linux'
          with tempfile.TemporaryDirectory(prefix='server-evidence-') as temporary:
              subprocess.run(['gh','run','download',run,'--repo',repo,'--name',f'server-{runtime}-verification','--dir',temporary],check=True)
              matches=list(Path(temporary).rglob(f'server-{platform}.trx'))
              if len(matches)!=1:raise ValueError('Expected exactly one integration report')
              root=matches[0].parent
              subprocess.run([sys.executable,'tests/server/verify_results.py','--runtime',runtime,'--results-dir',str(root)],check=True)
              output=Path('artifacts/revalidated-server');output.mkdir(parents=True)
              names=[f'server-{platform}.trx',f'server-package-{platform}.trx']
              if platform=='windows':names+=['windows-installer-result.json','windows-snapshot-result.json','windows-upgrade-result.json']
              for name in names:shutil.copy2(root/name,output/name)
              report={'sourceRun':int(run),'sourceCommit':commit,'sourceConclusion':source['conclusion'],
                      'sourceUrl':source['html_url'],'runtime':runtime,'reportsAccepted':True,'acceptanceRerun':False,
                      'validatedAtUtc':datetime.now(timezone.utc).isoformat()}
              (output/'revalidation-result.json').write_text(json.dumps(report,indent=2))
              print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: revalidated-server-${{ inputs.platform == 'windows' && 'win-x64' || 'linux-x64' }}-reports
          path: artifacts/revalidated-server
          retention-days: 14
