name: Build and verify

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*-preview.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore OneCBackup.slnx
      - run: dotnet build OneCBackup.slnx --no-restore -m:1 -nr:false
      - run: dotnet test tests/OneCBackup.Core.Tests --no-build --no-restore -m:1 -nr:false --filter 'Category!=FtpIntegration&Category!=NativeSqlIntegration'
      - run: python -m unittest discover -s tests/postgresql -v
      - run: python -m unittest discover -s tests/distribution -v
      - if: runner.os == 'Linux'
        run: |
          python -m pip install -r tests/ftp/requirements.txt
          python tests/ftp/run_integration.py
          python tests/agent_smoke.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ui | Out-Null
          $fixtureProcess = Start-Process -FilePath dotnet -ArgumentList @('src/OneCBackup.Desktop/bin/Debug/net10.0-windows/OneCBackup.Desktop.dll', '--smoke-ui', 'artifacts/ui') -PassThru
          if (-not $fixtureProcess.WaitForExit(120000)) {
            $fixtureProcess.Kill()
            throw 'WPF smoke test timed out'
          }
          Get-Content artifacts/ui/smoke-result.json
          if ($fixtureProcess.ExitCode -ne 0) { throw 'WPF smoke test failed' }
      - if: runner.os == 'Windows'
        run: |
          python -m pip install -r tests/encryption/requirements.txt
          python tests/encryption/verify_zip.py artifacts/ui/encrypted-fixture.zip
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-verification
          path: artifacts/ui/
          retention-days: 14

  native-sql:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ONECBACKUP_NATIVE_SQL: '1'
      ONECBACKUP_TEST_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          $localDb = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $localDb) { throw 'SQL Server LocalDB is required for native backup and restore verification' }
          if (-not (Test-Path (Join-Path $env:PGBIN 'pg_dump.exe'))) { throw 'PostgreSQL tools are required for native backup and restore verification' }
          "ONECBACKUP_TEST_LOCALDB_EXE=$($localDb.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: dotnet restore tests/OneCBackup.Core.Tests
      - run: dotnet build tests/OneCBackup.Core.Tests --no-restore -m:1 -nr:false
      - run: dotnet test tests/OneCBackup.Core.Tests --no-build --no-restore -m:1 -nr:false --filter 'Category=NativeSqlIntegration' --logger 'trx;LogFileName=native-sql.trx' --results-directory artifacts/native-sql
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sql-verification
          path: artifacts/native-sql/*.trx
          retention-days: 14

  package:
    needs: [verify, native-sql]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/distribution/run_update_handoff.py
      - run: python tools/build_windows_distribution.py
      - shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'artifacts/1C-Backup-windows-x64.zip'))
          try {
            $expectedVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0-dev' }
            foreach ($project in @('OneCBackup.Desktop', 'OneCBackup.Agent', 'OneCBackup.Core')) {
              $entry = $zip.GetEntry("1C-Backup/$project.dll")
              $path = Join-Path $PWD "artifacts/$project.version-check.dll"
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $path, $true)
              $actual = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path).ProductVersion
              if ($actual -ne "$expectedVersion+$env:GITHUB_SHA") { throw "Packaged $project has an unexpected version: $actual" }
              Remove-Item $path
            }
          } finally { $zip.Dispose() }
      - run: python tools/build_windows_installer.py
      - run: python tests/distribution/installer_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-distribution
          path: |
            artifacts/1C-Backup-windows-x64.zip
            artifacts/1C-Backup-windows-x64.zip.sha256
            artifacts/1C-Backup-windows-x64-setup.exe
            artifacts/1C-Backup-windows-x64-setup.exe.sha256
            artifacts/installer-result.json
            artifacts/update-manifest.json
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-windows-ui-verification
          path: artifacts/installed-ui/
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/publish_windows_update.py --notes docs/release-notes-preview.md
          if ($LASTEXITCODE -ne 0) { throw 'Update distribution publication failed' }
          gh release create "$env:GITHUB_REF_NAME" artifacts/1C-Backup-windows-x64.zip artifacts/1C-Backup-windows-x64.zip.sha256 artifacts/1C-Backup-windows-x64-setup.exe artifacts/1C-Backup-windows-x64-setup.exe.sha256 --verify-tag --prerelease --title "1C-Backup $env:GITHUB_REF_NAME — Windows x64" --notes-file artifacts/release-notes-with-updates.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
