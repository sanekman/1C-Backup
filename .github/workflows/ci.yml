name: Build and verify

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*-preview.*', 'v*-alpha.*', 'v*-beta.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore SPBackup.slnx
      - run: dotnet build SPBackup.slnx --no-restore -m:1 -nr:false
      - run: python -m unittest discover -s tests/postgresql -v
      - run: python -m unittest discover -s tests/distribution -v
      - name: Parse isolated Windows lab controllers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem tools/*windows_lab*.ps1) {
            $errors = $null; $tokens = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
          ./tests/windows_lab/controller_tests.ps1
      - name: Verify concurrent profile snapshots before long backup tests
        run: dotnet test tests/SPBackup.Core.Tests --no-build --no-restore -m:1 -nr:false --filter 'FullyQualifiedName~ProfileSnapshotConcurrencyTests'
      - if: runner.os == 'Linux'
        run: |
          python -m pip install -r tests/ftp/requirements.txt
          python tests/ftp/run_integration.py
          python tests/agent_smoke.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ui | Out-Null
          $fixtureProcess = Start-Process -FilePath dotnet -ArgumentList @('src/SPBackup.Desktop/bin/Debug/net10.0-windows/SPBackup.Desktop.dll', '--smoke-ui', 'artifacts/ui') -PassThru
          if (-not $fixtureProcess.WaitForExit(120000)) {
            $fixtureProcess.Kill()
            throw 'WPF smoke test timed out'
          }
          Get-Content artifacts/ui/smoke-result.json
          if ($fixtureProcess.ExitCode -ne 0) { throw 'WPF smoke test failed' }
      - if: runner.os == 'Windows'
        run: |
          python -m pip install -r tests/encryption/requirements.txt
          python tests/encryption/verify_zip.py artifacts/ui/encrypted-fixture.zip
      - run: dotnet test tests/SPBackup.Core.Tests --no-build --no-restore -m:1 -nr:false --filter 'Category!=FtpIntegration&Category!=NativeSqlIntegration&Category!=NativeSmbIntegration&FullyQualifiedName!~ProfileSnapshotConcurrencyTests'
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-verification
          path: artifacts/ui/
          retention-days: 14

  native-sql:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ONECBACKUP_NATIVE_SQL: '1'
      ONECBACKUP_TEST_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          $localDb = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $localDb) { throw 'SQL Server LocalDB is required for native backup and restore verification' }
          if (-not (Test-Path (Join-Path $env:PGBIN 'pg_dump.exe'))) { throw 'PostgreSQL tools are required for native backup and restore verification' }
          "ONECBACKUP_TEST_LOCALDB_EXE=$($localDb.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: dotnet restore tests/SPBackup.Core.Tests
      - run: dotnet build tests/SPBackup.Core.Tests --no-restore -m:1 -nr:false
      - run: dotnet test tests/SPBackup.Core.Tests --no-build --no-restore -m:1 -nr:false --filter 'Category=NativeSqlIntegration' --logger 'trx;LogFileName=native-sql.trx' --results-directory artifacts/native-sql
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sql-verification
          path: artifacts/native-sql/*.trx
          retention-days: 14

  native-smb:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ONECBACKUP_NATIVE_SMB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - run: dotnet restore tests/SPBackup.Core.Tests
      - run: dotnet build tests/SPBackup.Core.Tests --no-restore -m:1 -nr:false
      - name: Interrupt an owned SMB share during a real flushed transfer
        run: dotnet test tests/SPBackup.Core.Tests --no-build --no-restore -m:1 -nr:false --filter 'Category=NativeSmbIntegration' --logger 'trx;LogFileName=native-smb.trx' --results-directory artifacts/native-smb
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smb-verification
          path: artifacts/native-smb/*.trx
          retention-days: 14

  native-agent-service:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ONECBACKUP_NATIVE_SERVICE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - run: dotnet publish src/SPBackup.Agent -c Release -r win-x64 --self-contained true -o artifacts/native-agent/service-bin -m:1 -nr:false
      - shell: pwsh
        run: |
          # Existing SCM registrations keep the pre-rename application-host path.
          Copy-Item artifacts/native-agent/service-bin/SPBackup.Agent.exe artifacts/native-agent/service-bin/OneCBackup.Agent.exe
          $agent = Join-Path $PWD 'artifacts/native-agent/service-bin/OneCBackup.Agent.exe'
          dotnet run --project tests/WindowsAgentServiceSmoke -c Release -- $agent (Join-Path $PWD 'artifacts/native-agent')
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows agent service verification failed' }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-agent-service-verification
          path: |
            artifacts/native-agent/service-result.json
            artifacts/native-agent/failure-context.json
          retention-days: 14

  package:
    needs: [verify, native-sql, native-smb, native-agent-service]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/distribution/run_update_handoff.py
      - run: python tools/build_windows_distribution.py
      - shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD ('artifacts/SP-Backup-' + (Get-Content artifacts/distribution-version.txt).Trim() + '-windows-x64.zip')))
          try {
            $expectedVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0-dev' }
            foreach ($project in @('SPBackup.Desktop', 'SPBackup.Agent', 'SPBackup.Core')) {
              $entry = $zip.GetEntry("SP-Backup/$project.dll")
              $path = Join-Path $PWD "artifacts/$project.version-check.dll"
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $path, $true)
              $actual = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path).ProductVersion
              if ($actual -ne "$expectedVersion+$env:GITHUB_SHA") { throw "Packaged $project has an unexpected version: $actual" }
              Remove-Item $path
            }
          } finally { $zip.Dispose() }
      - run: python tools/build_windows_installer.py
      - run: python tests/distribution/installer_smoke.py
      - name: Upgrade the published alpha.25 installation to SP Backup
        run: python tests/distribution/legacy_upgrade_smoke.py
        env:
          SPBACKUP_UPGRADE_SMOKE: '1'
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-verification
          path: |
            artifacts/windows-upgrade-result.json
            artifacts/windows-upgrade-failure.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-distribution
          path: |
            artifacts/SP-Backup-*-windows-x64.zip
            artifacts/SP-Backup-*-windows-x64.zip.sha256
            artifacts/SP-Backup-*-windows-x64-setup.exe
            artifacts/SP-Backup-*-windows-x64-setup.exe.sha256
            artifacts/installer-result.json
            artifacts/update-manifest.json
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-windows-ui-verification
          path: artifacts/installed-ui/
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = if ($env:GITHUB_REF_NAME -like "*-alpha.*") { "docs/release-notes-alpha.md" } else { "docs/release-notes-preview.md" }
          python tools/publish_windows_update.py --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Update distribution publication failed' }
          $version = (Get-Content artifacts/distribution-version.txt).Trim()
          $files = Get-ChildItem "artifacts/SP-Backup-$version-windows-x64*" | ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" @files --verify-tag --prerelease --title "SP Backup $version — Windows x64" --notes-file artifacts/release-notes-with-updates.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
