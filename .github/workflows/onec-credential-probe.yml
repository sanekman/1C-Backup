name: Verify Windows PowerShell 1C credential transport
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  credential-transport:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-distribution
          run-id: 42766294210
          github-token: ${{ github.token }}
          path: artifacts/candidate
      - shell: pwsh
        run: |
          Expand-Archive -LiteralPath artifacts/candidate/SP-Backup-0.1.0-dev-windows-x64.zip -DestinationPath artifacts/expanded
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tests/windows_onec/credential_transport_tests.ps1 -AgentExecutable (Join-Path $PWD 'artifacts/expanded/SP-Backup/SPBackup.Agent.exe') -Output (Join-Path $PWD 'artifacts/credential-transport.json')
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell credential transport failed' }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-powershell-onec-credential-transport
          path: artifacts/credential-transport.json
          retention-days: 14
