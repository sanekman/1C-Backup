name: Build and verify storage gateway
on:
  push:
    branches: [main, 'feature/**']
    tags: ['storage-v*-alpha.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve storage version
        id: version
        shell: bash
        run: |
          version=$(cat deploy/storage/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "storage-v$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 10.0.402}
      - run: python3 -m unittest discover -s tests/storage -p 'test_*.py' -v
      - run: dotnet test tests/OneCBackup.Core.Tests --filter 'FullyQualifiedName~RemoteGatewayTests|FullyQualifiedName~RemoteProtocolSafetyTests'
      - run: docker build -f deploy/storage/Dockerfile --build-arg VERSION="$STORAGE_VERSION" -t onec-storage-bridge:ci .
        env:
          STORAGE_VERSION: ${{ steps.version.outputs.version }}
      - run: python3 tests/storage/container_smoke.py
        env:
          STORAGE_TEST_IMAGE: onec-storage-bridge:ci
      - run: python3 tools/build_storage_distribution.py --version "$STORAGE_VERSION"
        env:
          STORAGE_VERSION: ${{ steps.version.outputs.version }}
      - run: python3 tests/storage/lxc_installer_smoke.py --version "$STORAGE_VERSION"
        env:
          STORAGE_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: storage-linux-x64
          path: artifacts/OneCBackup-Storage-*.tar.gz*
  image:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/storage-v')
    runs-on: ubuntu-latest
    concurrency:
      group: storage-image-${{ github.ref_name }}
      cancel-in-progress: false
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing image
        run: python3 tools/check_storage_image_tag.py "$STORAGE_VERSION"
        env:
          STORAGE_VERSION: ${{ needs.verify.outputs.version }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/storage/Dockerfile
          build-args: VERSION=${{ needs.verify.outputs.version }}
          push: true
          tags: ghcr.io/sanekman/1c-backup-storage:${{ needs.verify.outputs.version }}
