name: Build and verify storage gateway
on:
  push:
    branches: [main, 'feature/**']
    tags: ['storage-v*-alpha.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 10.0.401}
      - run: dotnet test tests/OneCBackup.Core.Tests --filter 'FullyQualifiedName~RemoteGatewayTests|FullyQualifiedName~RemoteProtocolSafetyTests'
      - run: docker build -f deploy/storage/Dockerfile -t onec-storage-bridge:0.1.0-alpha.1 .
      - run: python3 tests/storage/container_smoke.py
      - run: python3 tools/build_storage_distribution.py
      - run: python3 tests/storage/lxc_installer_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: storage-linux-x64
          path: artifacts/OneCBackup-Storage-*.tar.gz*
  image:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/storage-v')
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/storage/Dockerfile
          push: true
          tags: ghcr.io/sanekman/1c-backup-storage:0.1.0-alpha.1
