name: Verify Windows PostgreSQL tool compatibility
on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
    paths:
      - '.github/workflows/windows-postgresql-compatibility.yml'
      - 'tools/windows_postgresql/**'
      - 'tests/WindowsPostgreSqlCompatibilitySmoke/**'
permissions:
  contents: read
concurrency:
  group: windows-postgresql-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Verify PostgreSQL 15–18 tools, rejection, delivery and real restoration
        shell: pwsh
        run: ./tools/windows_postgresql/test_compatibility.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-postgresql-compatibility-verification
          path: artifacts/postgresql-compatibility/*.json
          if-no-files-found: warn
          retention-days: 14
