# Same machine as the Windows/Linux hub backend. Change domain and email before enabling.
# Required modules: md, ssl, proxy, proxy_http (Apache 2.4.47+), headers.
MDContactEmail admin@example.com
MDCertificateAgreement accepted
MDCertificateAuthority https://acme-v02.api.letsencrypt.org/directory
MDRenewMode auto
MDomain relay.example.com
<VirtualHost *:80>
 ServerName relay.example.com
 # mod_md handles ACME HTTP-01 challenge requests.
</VirtualHost>
<VirtualHost *:443>
 ServerName relay.example.com
 SSLEngine on
 ProxyRequests Off
 ProxyPreserveHost On
 ProxyPass / http://127.0.0.1:7087/ upgrade=websocket timeout=3600
 ProxyPassReverse / http://127.0.0.1:7087/
 # Do not log Authorization, cookies or query strings.
 CustomLog logs/onec-relay-access.log "%t %m %U %>s"
</VirtualHost>
